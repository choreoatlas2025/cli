name: ChoreoAtlas CLI - CI

on:
  push:
    branches: [ main, master, 'fix/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: Install dependencies
      run: make deps
    
    - name: Run linting
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.14.0
        args: --timeout=5m
    
    - name: Run tests
      run: make test
    
    - name: Build binary
      run: make build

    - name: Run CLI regressions against the built binary
      env:
        CHOREOATLAS_CORRECTNESS_BINARY: ${{ github.workspace }}/bin/choreoatlas
      run: go test ./internal/cli -run '^(TestCorrectness|TestRecheck|TestRound3)' -count=1

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - uses: browser-actions/setup-chrome@v2
      id: chrome
      with:
        chrome-version: stable

    - name: Check HTML report in a real browser
      env:
        CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        CHOREOATLAS_HTML_FIXTURE: ${{ runner.temp }}/ce-report-fixture.html
      run: |
        go test ./internal/report/html -run '^TestHTMLUntrustedFieldsFixture$' -count=1
        node scripts/test-html-report.cjs "$CHROME_PATH" "$CHOREOATLAS_HTML_FIXTURE"
    
    - name: Run example validation
      run: make run-example

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: Build for multiple platforms
      run: |
        # Linux AMD64
        GOOS=linux GOARCH=amd64 make build BIN=bin/choreoatlas-linux-amd64
        # Linux ARM64
        GOOS=linux GOARCH=arm64 make build BIN=bin/choreoatlas-linux-arm64
        # macOS AMD64
        GOOS=darwin GOARCH=amd64 make build BIN=bin/choreoatlas-darwin-amd64
        # macOS ARM64 (M1/M2)
        GOOS=darwin GOARCH=arm64 make build BIN=bin/choreoatlas-darwin-arm64
        # Windows AMD64
        GOOS=windows GOARCH=amd64 make build BIN=bin/choreoatlas-windows-amd64.exe
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: choreoatlas-binaries
        path: bin/
